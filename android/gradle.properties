# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Only build for real device ABIs (drop x86 in production if desired)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Keep the classic bridge: the vault modules use the stable, well-audited
# NativeModule/ViewManager surface.
newArchEnabled=false

# Hermes: smaller, no JIT, bytecode-precompiled JS
hermesEnabled=true
